name: Build MCEF Vulkan add-on

on:
  push:
    paths:
      - '.github/**'
      - '**/*.gradle'
      - 'gradle.properties'
      - 'gradlew*'
      - 'gradle/**'
      - '**/src/**'
      - 'common/java-cef'
      - '.gitmodules'
  pull_request:
    paths:
      - '.github/**'
      - '**/*.gradle'
      - 'gradle.properties'
      - 'gradlew*'
      - 'gradle/**'
      - '**/src/**'
      - 'common/java-cef'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcef-vulkan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fabric 1.21.11 / Java 21
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source and pinned JCEF submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrappers
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          dependency-graph: disabled

      - name: Build MCEF and add-on, including compositor tests
        shell: bash
        run: |
          mkdir -p build
          ./gradlew --no-daemon --console=plain --stacktrace --no-parallel --max-workers=2 \
            :fabric:build :vulkan-addon:build 2>&1 | tee build/ci-build.log

      - name: Report build failure diagnostics
        if: ${{ failure() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('build/ci-build.log')
          if log.exists():
              text = log.read_text(errors='replace')
              if len(text) > 48000:
                  text = text[:24000] + '\n... log truncated ...\n' + text[-24000:]
              message = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Gradle build diagnostics::' + message)
          PY

      - name: Verify and prepare installable jars
        run: python3 .github/scripts/prepare-vulkan-artifacts.py

      - name: Upload MCEF and Vulkan add-on jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcef-vulkan-fabric-1.21.11-${{ github.run_number }}
          path: build/ci-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload JUnit results and test report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcef-vulkan-tests-${{ github.run_number }}
          path: |
            vulkan-addon/build/test-results/test/
            vulkan-addon/build/reports/tests/test/
            build/ci-build.log
          if-no-files-found: ignore
          retention-days: 14
